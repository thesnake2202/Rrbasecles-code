const tkey=(d,me)=>{const t=d.title,L=(me.match(/\s([A-Z])$/)||[])[1]||"A";if(/Vétérans|Veterans/i.test(t))return "Vétérans "+L;if(/Dames/i.test(t))return "Dames "+L;const n=(t.match(/Division\s*(\d)/)||[])[1];return "P"+n+" "+L};
function mDate(k,opp,w){const T=TEAMS[k];if(T){const o=nrm(opp),x=T.find(x=>x[2]&&[x[0],x[1]].some(n=>!n.startsWith("R.R. Bas")&&o.startsWith(nrm(n))));if(x){const[a,b]=x[2].split("/").map(Number),dt=new Date(b>=9?2026:2027,b-1,a);return dt.toLocaleDateString("fr-BE",{weekday:"short",day:"2-digit",month:"2-digit"})+(x[3]?" · "+x[3]:"")}}const[a,b]=D[w-1].split("/").map(Number);return "Semaine du "+new Date(b>=9?2026:2027,b-1,a).toLocaleDateString("fr-BE",{day:"2-digit",month:"2-digit"})}
const isVet=d=>/Vétérans|Veterans/i.test(d.title);
// Les vétérans ont une semaine d'avance : la semaine W des autres équipes correspond à la semaine W+1 des vétérans.
const DIVC={"Vétérans":"#f0b400","P1":"#ff4d4d","P2":"#ff6a3d","P3":"#ff8a1f","P4":"#3d9cff","P5":"#1fd1a0","P6":"#b06cff","Dames":"#ff5fa8"},DIVO=Object.keys(DIVC);
const dsplit=k=>{const i=k.lastIndexOf(" ");return[k.slice(0,i),k.slice(i+1)]};
function resultats(){if(!rw)rw=curWeek();const vw=rw<22?[rw+1]:[];if(rw==1)vw.unshift(1);[rw,...vw].forEach(loadCL);const ws=[rw,...vw].map(w=>CL[w]),c=ws.find(x=>x.loading||x.error)||{divisions:[...CL[rw].divisions.filter(d=>!isVet(d)),...vw.flatMap(w=>CL[w].divisions.filter(isVet))]};
let h=`<div class="rh"><h2>RÉSULTATS</h2><div class="wk"><button ${rw<=1?"disabled":""} onclick="rw--;draw()">◀</button><span>${rw}${rw==1?"ère":"ème"} semaine<span class="sub">${D[rw-1]}</span></span><button ${rw>=22?"disabled":""} onclick="rw++;draw()">▶</button></div></div>`;
if(c.loading)return h+`<p class="sub">Chargement des résultats AFTT…</p>`;
if(c.error)return h+`<p class="sub">${c.error} <button onclick="for(const w in CL)if(CL[w].error)delete CL[w];draw()">Réessayer</button></p>`;
const L=[];c.divisions.forEach(d=>d.matches.filter(m=>isMe(m.home)||isMe(m.away)).forEach(m=>{const me=isMe(m.home)?m.home:m.away,opp=isMe(m.home)?m.away:m.home,s=m.score||"",ff=/\bff\b|\bfg\b|forfait/i.test(s),n=s.match(/(\d+)\s*-\s*(\d+)/);
let r="";if(ff)r="F";else if(n){const a=+n[1],b=+n[2],e=isMe(m.home)?a-b:b-a;r=e>0?"V":e<0?"D":"N"}
const k=tkey(d,me),rk=(d.rows.find(x=>isMe(x.team))||{}).rank;L.push({d,m,me,opp,s,n,r,k,rk})}));
if(!L.length)return h+`<p class="sub">Aucun match de nos équipes cette semaine.</p>`;
const ord=k=>{const[v]=dsplit(k),i=DIVO.indexOf(v);return(i<0?99:i)+k};L.sort((a,b)=>ord(a.k).localeCompare(ord(b.k)));
const up=L.filter(x=>!x.r),pl=L.filter(x=>x.r),nb=k=>pl.filter(x=>x.r==k).length;
const IC={V:"✓",N:"=",D:"✗",F:"–"};
const row=x=>{const[dv,lt]=dsplit(x.k),col=DIVC[dv]||"#999",sh=dv=="Vétérans"?"Vét.":dv;
return `<tr><td class="dv" style="--c:${col}"><span class="l">${dv}</span><span class="s">${sh}</span></td><td><span class="l">Basècles </span>${lt}</td><td class="op">${x.opp}<span class="loc ${isMe(x.m.home)?"h":"a"}">${isMe(x.m.home)?`<span class="l">🏠 Domicile</span><span class="s">🏠 Dom.</span>`:`<span class="l">✈ Extérieur</span><span class="s">✈ Ext.</span>`}</span></td><td class="sc">${x.r?(x.r=="F"?`<small>Forfait</small>`:x.n[1]+" - "+x.n[2]):`<small>${mDate(x.k,x.opp,rw)}</small>`}</td><td class="r ${x.r||"U"}">${x.r?IC[x.r]:"…"}</td><td class="ck">${x.rk?`<span class="${x.rk==1?"first":""}">${x.rk}<sup>${x.rk==1?"er":"e"}</sup></span>`:"–"}</td></tr>`};
const tbl=a=>`<table class="rt"><colgroup><col style="width:17%"><col style="width:16%"><col style="width:28%"><col style="width:15%"><col style="width:11%"><col style="width:13%"></colgroup><tr><th><span class="l">Division</span><span class="s">Div.</span></th><th><span class="l">Équipe</span><span class="s">Éq.</span></th><th><span class="l">Adversaire</span><span class="s">Adv.</span></th><th>Score</th><th>Rés.</th><th><span class="l">Class.</span><span class="s">Cl.</span></th></tr>${a.map(row).join("")}</table>`;
const lg=(col,n,t)=>`<span><i style="background:${col}"></i>${n} ${t}</span>`;
if(pl.length)h+=tbl(pl)+`<div class="lgd">${lg("#22a03c",nb("V"),nb("V")>1?"victoires":"victoire")}${lg("#d98a0b",nb("N"),nb("N")>1?"nuls":"nul")}${lg("#d82020",nb("D"),nb("D")>1?"défaites":"défaite")}${nb("F")?lg("#7a7a7a",nb("F"),nb("F")>1?"forfaits":"forfait"):""}</div>`;
if(up.length)h+=`<div class="rsec">À venir</div>`+tbl(up);
return h+`<p class="warn">Données officielles AFTT (data.aftt.be). Les vétérans ayant une semaine d'avance, leur semaine N+1 est affichée avec la semaine N des autres équipes.${upd(CL[rw])}</p>`}
const ev=e=>e>0?`<span class="up">▲ +${e.toFixed(2)}</span>`:e<0?`<span class="dn">▼ ${e.toFixed(2)}</span>`:`<span class="eq">= 0</span>`;
function draw(){
document.getElementById("nav").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};draw()">${t}</button>`).join("");
let h="";
if(tab==0){const L=[...P].sort((a,b)=>sort=="pts"?b[3]-a[3]:b[2]-a[2]);
h=`<div class="tog"><button class="${sort=="pts"?"on":""}" onclick="sort='pts';draw()">Par points</button><button class="${sort=="evo"?"on":""}" onclick="sort='evo';draw()">Par évolution</button></div>`+
L.map((p,i)=>`<div class="row"><span class="rk">${i+1}</span><span class="nm">${p[0]}<br><span class="sub">${p[1]} matchs${p[4]?" · n° "+p[4]:""}</span></span><span class="pt">${p[3].toFixed(2)}</span><span class="ev">${ev(p[2])}</span></div>`).join("")+
`<p class="warn">Situation au 1er novembre 2026. ▲▼ = évolution depuis le début de saison.</p>`}
if(tab==1)h=resultats();
if(tab==2){const nm=t=>t.startsWith("R.R. Bas")?`<b>${t}</b>`:t,pl=TEAMS[team].filter(x=>x[4]),up=TEAMS[team].filter(x=>!x[4]);
const rs=x=>{if(x[4]=="ff")return "F";const s=x[4].split("-").map(Number),r=x[0].startsWith("R.R. Bas")?s[0]-s[1]:s[1]-s[0];return r>0?"V":r<0?"D":"N"};
const wd=d=>{const[a,b]=d.split("/").map(Number);return new Date(b>=9?2026:2027,b-1,a).toLocaleDateString("fr-BE",{weekday:"short"})};
const c=pl.map(rs),n=k=>c.filter(z=>z==k).length;
h=`<div class="tog">${Object.keys(TEAMS).map(k=>`<button class="${k==team?"on":""}" onclick="team='${k}';draw()">${k}</button>`).join("")}</div><h3>R.R. Basècles · ${team}</h3><p class="sub">Joués : ${pl.length} · ${n("V")} victoire(s) · ${n("N")} nul · ${n("D")} défaite(s)${n("F")?" · "+n("F")+" forfait(s)":""}</p><h3>À venir</h3>`+
up.map((x,i)=>`<div class="res F" ${i==0?'style="outline:2px solid var(--gold)"':""}><div>${nm(x[0])}<br>${nm(x[1])}</div><div class="sc">${x[2]}<br><span class="sub">${wd(x[2])} · ${x[3]}</span></div></div>`).join("")+
`<h3>Déjà joués</h3>`+pl.map(x=>`<div class="res ${rs(x)}"><div>${nm(x[0])}<br>${nm(x[1])}</div><div class="sc">${x[4]=="ff"?"0 - 0 ff":x[4].replace("-"," - ")}</div></div>`).join("")+
`<p class="warn">Contour doré = prochain match. Les dates des matchs déjà joués ne figuraient pas sur les captures. Noms d’équipes tronqués comme sur l’écran d’origine.</p>`}
if(tab==3)h=equipes();
document.getElementById("m").innerHTML=h}
draw();
</script></body></html>

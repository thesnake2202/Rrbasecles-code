const nrm=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/…/g,"").toLowerCase().trim();

const DIVC={"Vétérans":"#f0b400","P1":"#ff4d4d","P2":"#ff6a3d","P3":"#ff8a1f","P4":"#3d9cff","P5":"#1fd1a0","P6":"#b06cff","Dames":"#ff5fa8"},DIVO=Object.keys(DIVC);

function tbs(d,m){const me=isMe(m.home)?m.home:m.away,o=nrm(isMe(m.home)?m.away:m.home),w=isVet(d)?rw+1:rw,x=(teams()[tkey(d,me)]||[]).filter(z=>mres(z)&&Math.abs(z.week-w)<=1&&(nrm(z.opp).startsWith(o)||o.startsWith(nrm(z.opp)))).sort((a,b)=>Math.abs(a.week-w)-Math.abs(b.week-w))[0];return x?(x.homeForfeit||x.awayForfeit?"FF":x.score):""}let rw0=0,rwA=0;function adv(){if(rwA||rw!=rw0||rw>20)return;loadCL(rw+2);const c=CL[rw+2];if(c.loading)return;rwA=1;if(c.divisions&&c.divisions.some(d=>isVet(d)&&d.matches.some(m=>(isMe(m.home)||isMe(m.away))&&/[0-9] *- *[0-9]|ff|forfait/i.test(m.score||""))))rw++}function advE(){if(cwA||cw!=cw0||cw>20)return;loadCL(cw+2);const c=CL[cw+2];if(c.loading)return;cwA=1;if(c.divisions&&c.divisions.some(d=>isVet(d)&&d.matches.some(m=>(isMe(m.home)||isMe(m.away))&&/[0-9] *- *[0-9]|ff|forfait/i.test(m.score||""))))cw++}function resultats(){if(!rw){rw=curWeek(1);rw0=rw}adv();loadMT();const vw=rw<22?[rw+1]:[];if(rw==1)vw.unshift(1);[rw,...vw].forEach(loadCL);const ws=[rw,...vw].map(w=>CL[w]),c=ws.find(x=>x.loading||x.error)||{divisions:[...CL[rw].divisions.filter(d=>!isVet(d)),...vw.flatMap(w=>CL[w].divisions.filter(isVet))]};

const L=[];c.divisions.forEach(d=>d.matches.filter(m=>isMe(m.home)||isMe(m.away)).forEach(m=>{const me=isMe(m.home)?m.home:m.away,opp=isMe(m.home)?m.away:m.home,s=m.score||tbs(d,m),ff=/\bff\b|\bfg\b|forfait/i.test(s),n=s.match(/(\d+)\s*-\s*(\d+)/);
let r="";if(ff)r="F";else if(n){const a=+n[1],b=+n[2],e=isMe(m.home)?a-b:b-a;r=e>0?"V":e<0?"D":"N"}
const k=tkey(d,me),rk=(d.rows.find(x=>isMe(x.team))||{}).rank;L.push({d,m,me,opp,s,n,r,k,rk})}));

L.sort((a,b)=>ord(a.k).localeCompare(ord(b.k)));
const up=L.filter(x=>!x.r),pl=L.filter(x=>x.r),nb=k=>pl.filter(x=>x.r==k).length;
const IC={V:"✓",N:"=",D:"✗",F:"–"};
const row=x=>{const[dv,lt]=dsplit(x.k),col=DIVC[dv]||"#999",sh=dv=="Vétérans"?"Vét.":dv;
return `<tr><td class="dv" style="--c:${col}"><span class="l">${dv}</span><span class="s">${sh}</span></td><td><span class="l">Basècles </span>${lt}</td><td class="op">${x.opp}<span class="loc ${isMe(x.m.home)?"h":"a"}">${isMe(x.m.home)?`<span class="l">🏠 Domicile</span><span class="s">🏠 Dom.</span>`:`<span class="l">✈ Extérieur</span><span class="s">✈ Ext.</span>`}</span></td><td class="sc">${x.r?(x.r=="F"?`<small>Forfait</small>`:x.n[1]+" - "+x.n[2]):`<small>${mDate(x.k,x.opp,rw)}</small>`}</td><td class="r ${x.r||"U"}">${x.r?IC[x.r]:"…"}</td><td class="ck">${x.rk?`<span class="${x.rk==1?"first":""}">${x.rk}<sup>${x.rk==1?"er":"e"}</sup></span>`:"–"}</td></tr>`};
const tbl=a=>`<table class="rt"><colgroup><col style="width:17%"><col style="width:16%"><col style="width:28%"><col style="width:15%"><col style="width:11%"><col style="width:13%"></colgroup><tr><th><span class="l">Division</span><span class="s">Div.</span></th><th><span class="l">Équipe</span><span class="s">Éq.</span></th><th><span class="l">Adversaire</span><span class="s">Adv.</span></th><th>Score</th><th>Rés.</th><th><span class="l">Class.</span><span class="s">Cl.</span></th></tr>${a.map(row).join("")}</table>`;
const lg=(col,n,t)=>`<span><i style="background:${col}"></i>${n} ${t}</span>`;
if(pl.length)h+=tbl(pl)+`<div class="lgd">${lg("#22a03c",nb("V"),nb("V")>1?"victoires":"victoire")}${lg("#d98a0b",nb("N"),nb("N")>1?"nuls":"nul")}${lg("#d82020",nb("D"),nb("D")>1?"défaites":"défaite")}${nb("F")?lg("#7a7a7a",nb("F"),nb("F")>1?"forfaits":"forfait"):""}</div>`;
if(up.length)h+=`<div class="rsec">À venir</div>`+tbl(up);
return h+`<p class="warn">Données officielles AFTT (data.aftt.be). Les vétérans ayant une semaine d'avance, leur semaine N+1 est affichée avec la semaine N des autres équipes.${upd(CL[rw])}</p>`}
const ev=e=>e>0?`<span class="up">▲ +${e.toFixed(2)}</span>`:e<0?`<span class="dn">▼ ${e.toFixed(2)}</span>`:`<span class="eq">= 0</span>`;
function draw(){
document.getElementById("nav").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};sel='';draw()">${t}</button>`).join("");
let h="";
if(tab==0){loadPL();if(PL.loading)h=`<p class="sub">Chargement du classement des joueurs AFTT…</p>`;
else if(PL.error)h=`<p class="sub">${esc(PL.error)} <button onclick="PL=null;draw()">Réessayer</button></p>`;
else if(sel)h=fiche();
else{const L=[...PL.players].sort((a,b)=>sort=="pts"?b.points-a.points:b.evolution-a.evolution);
h=`<div class="tog"><button class="${sort=="pts"?"on":""}" onclick="sort='pts';draw()">Par points</button><button class="${sort=="evo"?"on":""}" onclick="sort='evo';draw()">Par évolution</button></div>`+
L.map((p,i)=>`<div class="row ck" role="button" tabindex="0" onclick="openP('${esc(p.licence)}')" onkeydown="if(event.key=='Enter')openP('${esc(p.licence)}')"><span class="rk">${i+1}</span><span class="nm">${esc(p.name)}<br><span class="sub">${p.cat?esc(p.cat)+" · ":""}${p.matches} matchs${p.rank?" · n° "+p.rank:""}</span></span><span class="pt">${p.points.toFixed(2)}</span><span class="ev">${ev(p.evolution)}</span><span class="go">›</span></div>`).join("")+
`<p class="warn">Classement numérique officiel AFTT (data.aftt.be), mis à jour automatiquement. ▲▼ = évolution depuis les points de base du début de saison. Touchez un joueur pour voir son graphique d'évolution.${upd(PL)}</p>`}}
if(tab==1)h=resultats();
if(tab==2){loadMT();if(MT.loading)h=`<p class="sub">Chargement des matchs AFTT…</p>`;
else if(MT.error)h=`<p class="sub">${esc(MT.error)} <button onclick="MT=null;draw()">Réessayer</button></p>`;
else{const T=teams(),K=Object.keys(T);if(!T[team])team=K[0];const all=T[team]||[];
const pl=all.filter(x=>mres(x)),up=all.filter(x=>!mres(x)),c=pl.map(mres),n=k=>c.filter(z=>z==k).length;
const nm=x=>{const me=`<b>R.R. Basècles ${esc(dsplit(team)[1])}</b>`,o=esc(x.opp);return x.isHome?me+"<br>"+o:o+"<br>"+me};
const when=x=>x.date?`${fdate(x,{day:"2-digit",month:"2-digit"})}<br><span class="sub">${fdate(x,{weekday:"short"})}${x.time?" · "+x.time:""}</span>`:`<span class="sub">Date à fixer</span>`;
const sc=x=>mres(x)=="F"?"Forfait":esc(x.score.replace(/\s*-\s*/," - "));
h=`<div class="tog">${K.map(k=>`<button class="${k==team?"on":""}" onclick="team='${esc(k)}';draw()">${esc(k)}</button>`).join("")}</div><h3>R.R. Basècles · ${esc(team)}</h3><p class="sub">${esc((all[0]||{}).division||"")}<br>Joués : ${pl.length} · ${n("V")} victoire(s) · ${n("N")} nul · ${n("D")} défaite(s)${n("F")?" · "+n("F")+" forfait(s)":""}</p>`+
(up.length?`<h3>À venir</h3>`+up.map((x,i)=>`<div class="res F" ${i==0?'style="outline:2px solid var(--gold)"':""}><div>${nm(x)}</div><div class="sc">${when(x)}</div></div>`).join(""):"")+
(pl.length?`<h3>Déjà joués</h3>`+pl.map(x=>`<div class="res ${mres(x)}"><div>${nm(x)}</div><div class="sc">${sc(x)}<br><span class="sub">${fdate(x,{day:"2-digit",month:"2-digit"})}</span></div></div>`).join(""):"")+
`<p class="warn">Calendrier et résultats officiels AFTT, mis à jour automatiquement. Contour doré = prochain match.${upd(MT)}</p>`}}
if(tab==3)h=equipes();
document.getElementById("m").innerHTML=h}

// Fiche joueur : graphique d'évolution des points + détail des matchs (data.aftt.be).
function openP(l){sel=l;if(!PF[l]){PF[l]={loading:1};fetch("data/joueur/"+encodeURIComponent(l)+".json").then(r=>r.json()).then(j=>PF[l]=j).catch(()=>PF[l]={error:"Connexion impossible."}).finally(()=>{if(tab==0&&sel==l)draw()})}history.pushState({p:l},"");draw();scrollTo(0,0)}
function closeP(){if(history.state&&history.state.p)history.back();else{sel="";draw()}}
addEventListener("popstate",e=>{sel=(e.state&&e.state.p)||"";draw()});
const f2=n=>n.toLocaleString("fr-BE",{minimumFractionDigits:2,maximumFractionDigits:2});
const MO="janv. févr. mars avr. mai juin juil. août sept. oct. nov. déc.".split(" ");
// Lignes de palier (classements lettres) à superposer à un graphique : G = { all:[{v,t}], need:[valeurs à inclure] }.
function guides(G,lo,hi,Y,W,R,L,up){if(!G||!G.all.length)return"";let last=-99;const vis=G.all.filter(g=>g.v>=lo&&g.v<=hi);
return vis.map(g=>{const y=Y(g.v),ly=up?y-4:y+12,lab=Math.abs(ly-last)>12;if(lab)last=ly;return `<line class="tl" x1="${L}" x2="${W-R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/>${lab?`<text class="tt" x="${W-R+4}" y="${(y+4).toFixed(1)}">${esc(g.t)}</text>`:""}`}).join("")}
const span=(v,G,min,floor)=>{let lo=Math.min(...v,...(G?G.need:[])),hi=Math.max(...v,...(G?G.need:[]));if(hi-lo<min){const c=(hi+lo)/2;lo=c-min/2;hi=c+min/2}const pd=(hi-lo)*.1;return[floor!=null?Math.max(floor,lo-pd):lo-pd,hi+pd]};
function chart(H,G){if(H.length<2)return `<div class="chart"><p class="sub" style="text-align:center;padding:30px 0">Pas encore assez de données pour afficher une évolution.</p></div>`;
const W=600,Ht=230,L=48,R=G&&G.all.length?34:16,T=22,B=28,v=H.map(x=>x.points);const[lo,hi]=span(v,G,10);
const X=i=>L+(W-L-R)*i/(H.length-1),Y=y=>T+(Ht-T-B)*(hi-y)/(hi-lo);
const tk=Array.from({length:4},(_,i)=>lo+(hi-lo)*i/3);
const pts=H.map((x,i)=>X(i).toFixed(1)+","+Y(x.points).toFixed(1));
const lab=(x,i)=>i==0?"Base":(()=>{const[y,m]=x.date.split("-").map(Number);return MO[m-1]+(i==H.length-1||m==1?" "+String(y).slice(2):"")})();
const step=Math.ceil(H.length/8);
return `<div class="chart"><svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Évolution des points"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e03030" stop-opacity=".35"/><stop offset="1" stop-color="#e03030" stop-opacity="0"/></linearGradient></defs>
${tk.map(t=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-6}" y="${Y(t)+4}" text-anchor="end">${Math.round(t)}</text>`).join("")}
${guides(G,lo,hi,Y,W,R,L,1)}
<polygon fill="url(#ga)" points="${X(0)},${Ht-B} ${pts.join(" ")} ${X(H.length-1)},${Ht-B}"/><polyline class="ln" points="${pts.join(" ")}"/>
${H.map((x,i)=>`<circle class="dt" cx="${X(i)}" cy="${Y(x.points)}" r="4"><title>${i==0?"Points de base":new Date(x.date+"T12:00:00").toLocaleDateString("fr-BE",{day:"2-digit",month:"long",year:"numeric"})} : ${f2(x.points)} pts</title></circle>${i%step==0||i==H.length-1?`<text x="${X(i)}" y="${Ht-8}" text-anchor="${i==0?"start":i==H.length-1?"end":"middle"}">${lab(x,i)}</text>`:""}`).join("")}
<text class="lv" x="${X(H.length-1)}" y="${Y(v[v.length-1])-10}" text-anchor="end">${f2(v[v.length-1])}</text></svg>
${G&&G.all.length?`<p class="nt">Pointillés dorés = points minimum de chaque palier aujourd'hui.</p>`:""}</div>`}
// Graphique d'évolution de la position au classement numérique (1 = meilleur, en haut).
const n0=n=>n.toLocaleString("fr-BE");
function rchart(R,G,P){if(!R.length)return `<div class="chart"><p class="sub" style="text-align:center;padding:30px 12px">Pas encore de position au classement numérique (actif à partir de 10 matchs).</p></div>`;
const W=600,Ht=230,L=56,R0=G&&G.all.length?34:16,T=22,B=28,t=R.map(x=>Date.parse(x.date+"T12:00:00")),v=R.map(x=>x.position);
const[lo,hi]=span(v,G,20,1);
const t0=t[0],t1=Math.max(t[t.length-1],t0+864e5),X=i=>R.length<2?(L+W-R0)/2:L+(W-L-R0)*(t[i]-t0)/(t1-t0),Y=y=>T+(Ht-T-B)*(y-lo)/(hi-lo);
const tk=Array.from({length:4},(_,i)=>lo+(hi-lo)*i/3),pts=R.map((x,i)=>X(i).toFixed(1)+","+Y(x.position).toFixed(1));
const fd=(d,o)=>new Date(d+"T12:00:00").toLocaleDateString("fr-BE",o),sd={day:"2-digit",month:"2-digit",year:"2-digit"};
const lab=R.length<2?[0]:[0,...(R.length>2?[Math.floor((R.length-1)/2)]:[]),R.length-1];
const cur=v[v.length-1],prev=v.length>1?v[v.length-2]:null,dv=prev==null?0:prev-cur,c=R[R.length-1].cat;
const vs=prev==null?`<span class="eq">–</span>`:dv>0?`<span class="up">▲ ${n0(dv)}</span>`:dv<0?`<span class="dn">▼ ${n0(-dv)}</span>`:`<span class="eq">= 0</span>`;
// Bande du palier actuel (entre la limite du palier supérieur et celle du palier projeté).
const band=P&&P.top!=null?(()=>{const a=Math.max(lo,P.top),b=Math.min(hi,P.bottom);return b>a?`<rect class="tb" x="${L}" width="${W-L-R0}" y="${Y(a).toFixed(1)}" height="${(Y(b)-Y(a)).toFixed(1)}"/>`:""})():"";
return `<div class="chart"><svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Évolution de la position au classement"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b7cff" stop-opacity=".35"/><stop offset="1" stop-color="#5b7cff" stop-opacity="0"/></linearGradient></defs>
${band}${tk.map(y=>`<line class="gl" x1="${L}" x2="${W-R0}" y1="${Y(y)}" y2="${Y(y)}"/><text x="${L-6}" y="${Y(y)+4}" text-anchor="end">${n0(Math.round(y))}</text>`).join("")}
${guides(G,lo,hi,Y,W,R0,L,1)}
${R.length>1?`<polygon fill="url(#gb)" points="${X(0)},${Ht-B} ${pts.join(" ")} ${X(R.length-1)},${Ht-B}"/><polyline class="ln b" points="${pts.join(" ")}"/>`:""}
${R.map((x,i)=>`<circle class="dt b" cx="${X(i)}" cy="${Y(x.position)}" r="${R.length>40?2.5:4}"><title>${fd(x.date,{day:"2-digit",month:"long",year:"numeric"})} : ${n0(x.position)}e${x.cat?" ("+esc(x.cat)+")":""}</title></circle>`).join("")}
${lab.map(i=>`<text x="${X(i)}" y="${Ht-8}" text-anchor="${R.length<2?"middle":i==0?"start":i==R.length-1?"end":"middle"}">${fd(R[i].date,sd)}</text>`).join("")}
<text class="lv b" x="${X(R.length-1)}" y="${Y(cur)-10}" text-anchor="${R.length<2?"middle":"end"}">${n0(cur)}e</text></svg>
<div class="rs"><div><span>Classement actuel</span><b style="color:#8ea2ff">${n0(cur)}</b>${c?`<span class="cb" style="display:inline-block">${esc(c)}</span>`:""}</div><div class="r"><span>vs précédent</span><b>${vs}</b></div>
<div><span>Meilleur classement</span><b>${n0(Math.min(...v))}</b></div><div class="r"><span>Pire classement</span><b>${n0(Math.max(...v))}</b></div></div>
${G&&G.all.length?`<p class="nt">Pointillés dorés = dernière place de chaque palier (au-dessus de la ligne = ce classement ou mieux).</p>`:""}
${R.length<2?`<p class="nt">L'historique se construit automatiquement : la position est relevée chaque jour.</p>`:""}</div>`}
// Échelle des paliers : où se situe le joueur et combien de places / points le séparent des classements voisins.
let allT=false;
function ladder(Lm,pos,pts,i){const sp=n=>n>0?"+"+f2(n):f2(n),pl=n=>n0(n)+(n>1?" places":" place");
const row=(l,j)=>{let g="",k=j<i?"up":j>i?"dn":"me";
if(j<i){const dp=pos-l.lastPosition,dpt=l.points!=null&&pts!=null?l.points-pts:null;g=`${dpt!=null?(dpt>0?"+"+f2(dpt)+" pts":"≈ atteint"):"–"}<small>gagner ${pl(dp)}</small>`}
else if(j==i){const up=Lm[j-1],dn=l;g=`Vous êtes ici<small>${dn.points!=null&&pts!=null?"marge "+f2(Math.max(0,pts-dn.points))+" pts · ":""}${pl(dn.lastPosition-pos)} d'avance</small>`}
else{const b=Lm[j-1],dpt=b.points!=null&&pts!=null?pts-b.points:null;g=`${dpt!=null?"−"+f2(Math.max(0,dpt))+" pts":"–"}<small>si ${pl(b.lastPosition-pos+1)} perdues</small>`}
return `<div class="t ${k}"><span class="c">${esc(l.cat)}</span><span>jusqu'à la ${n0(l.lastPosition)}e place<br><span class="sub">${l.points!=null?"≥ "+f2(l.points)+" pts":"tous les actifs"}</span></span><span class="g">${g}</span></div>`};
const near=Lm.map((l,j)=>[l,j]).filter(([,j])=>allT||Math.abs(j-i)<=2);
return `<div class="lad">${near.map(([l,j])=>row(l,j)).join("")}<button class="mo" onclick="allT=!allT;draw()">${allT?"Afficher seulement les paliers proches":"Voir tous les paliers (A → E6)"}</button></div>`}
const dl=n=>n>0?`<span class="up">+${f2(n)}</span>`:n<0?`<span class="dn">${f2(n)}</span>`:`<span class="eq">0</span>`;
function fiche(){const p=(PL.players||[]).find(x=>x.licence==sel)||{name:"",licence:sel},f=PF[sel]||{loading:1};
let h=`<div class="pf"><button class="bk" onclick="closeP()">◀ Classement</button><h2>${esc(p.name||f.name)}</h2><span class="sub">${p.cat?esc(p.cat)+" · ":""}Licence ${esc(sel)}${p.rank?" · n° "+p.rank+" du classement":""}</span>`;
if(f.loading)return h+`<p class="sub">Chargement de la fiche AFTT…</p></div>`;
if(f.error)return h+`<p class="sub">${esc(f.error)} <button onclick="delete PF['${esc(sel)}'];openP('${esc(sel)}')">Réessayer</button></p></div>`;
const H=f.history||[],v=H.map(x=>x.points),cur=v.length?v[v.length-1]:p.points||0,e=v.length?cur-v[0]:0;
h+=`<div class="kp"><div><span>Actuel</span><b class="pt">${f2(cur)}</b></div><div><span>Évolution</span><b>${dl(e)}</b></div><div><span>Plus haut</span><b>${v.length?f2(Math.max(...v)):"–"}</b></div><div><span>Plus bas</span><b>${v.length?f2(Math.min(...v)):"–"}</b></div></div>`;
const RK=f.ranks||[],LI=f.limits||{},Lm=(LI.limits||[]).filter(l=>l.cat!="NC"),pos=RK.length?RK[RK.length-1].position:f.position||0,mp=p.points!=null?p.points:v.length?cur:null;
const ti=pos&&Lm.length?Lm.findIndex(l=>pos<=l.lastPosition):-2,need=ti>=0?[Lm[ti-1],Lm[ti]].filter(Boolean):[];
const GP=Lm.length?{all:Lm.filter(l=>l.points!=null).map(l=>({v:l.points,t:l.cat})),need:need.filter(l=>l.points!=null).map(l=>l.points)}:null;
const GR=Lm.length?{all:Lm.map(l=>({v:l.lastPosition,t:l.cat})),need:need.map(l=>l.lastPosition)}:null;
const PB=ti>=0?{top:ti>0?Lm[ti-1].lastPosition:1,bottom:Lm[ti].lastPosition}:null;
h+=`<div class="charts"><div><h3>Évolution des points</h3>${chart(H,GP)}</div><div><h3>Évolution du classement</h3>${rchart(RK,GR,PB)}</div></div>`;
if(ti>=0){const P=Lm[ti],U=Lm[ti-1];
h+=`<h3>Paliers de classement</h3><div class="pal"><div><span>Palier actuel</span><b class="pt">${esc(P.cat)}</b>${p.cat||f.cat?` <span class="sub" style="display:inline">(classement de la saison : ${esc(p.cat||f.cat)})</span>`:""}</div>${U?`<div><span>Vers ${esc(U.cat)}</span><b class="up">${U.points!=null&&mp!=null?"+"+f2(Math.max(0,U.points-mp))+" pts":"–"}</b> <span class="sub" style="display:inline">· ${n0(pos-U.lastPosition)} places</span></div>`:""}${Lm[ti+1]?`<div><span>Avant ${esc(Lm[ti+1].cat)}</span><b class="dn">${P.points!=null&&mp!=null?"−"+f2(Math.max(0,mp-P.points))+" pts":"–"}</b> <span class="sub" style="display:inline">· ${n0(P.lastPosition-pos)} places</span></div>`:""}</div>`+ladder(Lm,pos,mp,ti)+
`<p class="warn">Paliers d'après le tableau d'équivalence officiel AFTT 2026-2027 : ${n0(LI.actives)} joueurs actifs hors NC (page Outils AFTT${LI.afttCalc?", calcul du "+esc(LI.afttCalc):""}) → tranche ${n0(11750+500*Math.min(16,Math.max(0,Math.floor((LI.actives-11750)/500))))} à ${n0(12249+500*Math.min(16,Math.max(0,Math.floor((LI.actives-11750)/500))))}. Points des paliers = points du dernier joueur à l'intérieur du palier au classement numérique du ${new Date(LI.day+"T12:00:00").toLocaleDateString("fr-BE")}. Estimation indicative : le classement définitif est fixé par l'AFTT en fin de saison.</p>`}
else if(ti==-2&&pos&&!Lm.length)h+=`<p class="sub">Les paliers de classement sont en cours de calcul, revenez dans quelques minutes.</p>`;
const D2=f.days||[];
if(D2.length)h+=`<h3>Matchs de la saison</h3>`+D2.map(d=>`<div class="day"><h4><span>${esc(d.date)} · ${esc(d.club)}</span>${dl(d.total)}</h4>${d.matches.map(m=>`<div class="m"><span>${esc(m.opponent)}<br><span class="sub">${esc(m.ranking)}${m.opponentPoints?" · "+f2(m.opponentPoints)+" pts":""}${m.women?" · Dames":""}</span></span><b>${esc(m.score)}</b><span class="d">${dl(m.delta)}</span></div>`).join("")}</div>`).join("");
else h+=`<p class="sub">Aucun match enregistré cette saison.</p>`;
return h+`<p class="warn">Données officielles AFTT, mises à jour automatiquement. Les points d'un mois sont comptabilisés le 1er du mois suivant. Le classement = position au classement numérique AFTT sans les inactifs (1 = meilleur), relevée automatiquement chaque jour. <a href="${esc(f.url)}" target="_blank" rel="noopener" style="color:var(--gold)">Voir la fiche sur data.aftt.be ↗</a></p></div>`}
draw();
</script></body></html>

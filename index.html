<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>Royal Raquette Rouge Basècles</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#141416;--card:#222226;--alt:#1b1b1e;--tx:#f2f2f2;--mu:#9a9aa0;--red:#b01010;--gold:#f0be5a;--ok:#3cc85a;--ko:#ff5050;--nul:#d98a0b;

.pt{color:var(--gold);font-weight:700}.ev{width:76px;text-align:right;font-weight:700}.up{color:var(--ok)}.dn{color:var(--ko)}.eq{color:var(--mu)}
.sub{font-size:12px;color:var(--mu);font-weight:400}.tog{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}

.wk{display:flex;align-items:center;gap:6px;margin-bottom:8px}.wk button{padding:9px 14px;border-radius:8px;border:1px solid var(--mu);background:var(--card);color:var(--tx);font-weight:700}.wk button:disabled{opacity:.35}.wk span{flex:1;text-align:center;font-weight:700}

.mt{display:flex;gap:8px;padding:8px 10px;background:var(--card);border-radius:8px;margin-bottom:4px;font-size:14px}.mt span{flex:1}.mt span:last-child{text-align:right}.mt b{color:var(--gold);min-width:70px;text-align:center}
@media (max-width:420px){.cl .x{display:none}}
.rh{text-align:center;margin:8px 0 12px}.rh h2{margin:0;font-size:46px;font-style:italic;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,var(--tx) 45%,#ff9e9e);-webkit-background-clip:text;background-clip:text;color:transparent}
.rh .wk{justify-content:center;margin:4px 0 0}.rh .wk span{flex:0 1 auto;min-width:170px;color:var(--gold);font-size:20px;font-weight:800}.rh .wk span .sub{display:block;font-size:12px}
table.rt{width:100%;border-collapse:separate;border-spacing:3px;table-layout:fixed;font-size:15px;margin:0 -3px;width:calc(100% + 6px)}
.rt th{background:#c41818;color:#fff;padding:9px 2px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.rt td{background:var(--card);padding:6px 4px;height:52px;text-align:center;font-weight:800;overflow:hidden;text-overflow:ellipsis}
.rt td.dv{--c:#999;color:var(--c);font-style:italic;text-transform:uppercase;box-shadow:inset -4px 0 0 var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 24%,var(--card)),var(--card))}
.rt td.op{--op:#8cc4ff;color:var(--op);font-size:13px;background:var(--alt)}:root[data-theme="light"] .rt td.op{--op:#1d5fae}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .rt td.op{--op:#1d5fae}}
.rt td.sc{color:var(--gold);font-size:20px;white-space:nowrap}.rt td.sc small{display:block;font-size:11px;white-space:normal;line-height:1.3}
.rt td.r{color:#fff;font-size:24px;line-height:1}.rt td.r.V{background:#22a03c}.rt td.r.N{background:#d98a0b}.rt td.r.D{background:#d82020}.rt td.r.F{background:#7a7a7a}.rt td.r.U{background:var(--alt);color:var(--mu);font-size:16px}
.rt td.ck span{display:inline-block;min-width:44px;border:2px solid #d82020;border-radius:7px;padding:2px 6px;color:var(--gold);background:rgba(0,0,0,.25);font-size:17px}.rt td.ck span.first{border-color:var(--gold)}.rt td.ck sup{font-size:10px;vertical-align:-2px}
.rt .loc{display:block;width:max-content;max-width:100%;margin:4px auto 0;padding:1px 7px;border-radius:9px;font-size:10px;font-style:normal;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:#fff}.rt .loc.h{background:#1f8a4c}.rt .loc.a{background:#5a6170}
.rt .s{display:none}.lgd{display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px 14px;margin:14px 0 6px;font-size:16px}.lgd i{display:inline-block;width:15px;height:15px;border-radius:3px;vertical-align:-2px;margin-right:6px}
.rsec{margin:22px 0 6px;font-style:italic;font-weight:900;text-transform:uppercase;display:inline-block;background:#c41818;color:#fff;padding:5px 18px;clip-path:polygon(6% 0,100% 0,94% 100%,0 100%)}
@media (max-width:560px){.rh h2{font-size:36px}table.rt{font-size:12px;border-spacing:2px;margin:0 -2px;width:calc(100% + 4px)}.rt th{font-size:9px;padding:7px 1px;letter-spacing:0}.rt td{padding:5px 2px;height:46px}.rt td.op{font-size:11px;white-space:normal;overflow-wrap:anywhere;line-height:1.2}.rt td.sc{font-size:14px}.rt .loc{font-size:8px;padding:1px 4px;margin-top:3px}.rt td.sc small{font-size:9px}.rt td.r{font-size:18px}.rt td.ck span{min-width:0;font-size:13px;padding:1px 4px}.rt .l{display:none}.rt .s{display:inline}.lgd{font-size:14px}}
</style></head><body>
<header><h1>H297</h1><b>Royal Raquette Rouge Basècles</b><small>Tennis de table · saison 2026-2027</small></header>
<nav id="nav"></nav><main id="m"></main>
<script>
const D="19/09 26/09 03/10 10/10 17/10 31/10 07/11 14/11 28/11 05/12 12/12 16/01 23/01 30/01 13/02 20/02 06/03 13/03 27/03 10/04 17/04 24/04".split(" ");
const CLUB="H297";let team="",PL=null,MT=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const load=(u,set,t)=>{set({loading:1});fetch(u).then(r=>r.json()).then(set).catch(()=>set({error:"Connexion impossible."})).finally(()=>{if(t.includes(tab))draw()})};
const loadPL=()=>{if(!PL)load("/api/joueurs",j=>PL=j,[0])},loadMT=()=>{if(!MT)load("/api/matchs",j=>MT=j,[1,2])};
const upd=j=>j&&j.fetchedAt?" Dernière mise à jour : "+new Date(j.fetchedAt).toLocaleString("fr-BE",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})+".":"";
const TABS=["Classement joueurs","Résultats","Matchs","Équipes"];let tab=0,sort="pts";
const CL={};let cw=0,cd=0,rw=0;
const isMe=t=>/Basecles|Basècles/i.test(t);
const short=t=>t.replace(/^Division\s*/,"").replace(/\s*-\s*Prov\. Hainaut\s*-\s*/," · ");
function curWeek(){const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());const k=D.filter(d=>{const[a,b]=d.split("/").map(Number);return new Date(b>=9?2026:2027,b-1,a)<t}).length;return Math.min(22,Math.max(1,k))}
const shown=w=>(tab==3&&cw==w)||(tab==1&&(rw==w||rw+1==w));
function loadCL(w,force){const o=CL[w];if(o&&!force)return;if(o&&o.busy)return;const keep=o&&o.divisions;if(keep)o.busy=1;else CL[w]={loading:1};
fetch("/api/classement?semaine="+w).then(r=>r.json()).then(j=>{if(j.divisions||!keep)CL[w]=j}).catch(()=>{if(!keep)CL[w]={error:"Connexion impossible."}}).finally(()=>{if(CL[w])delete CL[w].busy;if(shown(w))draw()})}
// Actualisation automatique : les semaines affichées sont rechargées toutes les 5 minutes et au retour sur l'onglet.
function refresh(){if(document.hidden)return;for(const w in CL)if(shown(+w))loadCL(+w,1)}
setInterval(refresh,5*60*1000);document.addEventListener("visibilitychange",refresh);
const upd=c=>c&&c.fetchedAt?` Dernière mise à jour : ${new Date(c.fetchedAt).toLocaleTimeString("fr-BE",{hour:"2-digit",minute:"2-digit"})}.`:"";
function equipes(){if(!cw)cw=curWeek();loadCL(cw);const c=CL[cw];
let h=`<div class="wk"><button ${cw<=1?"disabled":""} onclick="cw--;draw()">◀</button><span>Semaine ${cw}</span><button ${cw>=22?"disabled":""} onclick="cw++;draw()">▶</button></div>`;
if(c.loading)return h+`<p class="sub">Chargement des classements AFTT…</p>`;
if(c.error)return h+`<p class="sub">${c.error} <button onclick="delete CL[${cw}];draw()">Réessayer</button></p>`;
const dv=c.divisions;if(cd>=dv.length)cd=0;
h+=`<h3>Nos équipes</h3><div class="ov">${dv.map((d,i)=>{const r=d.rows.find(x=>isMe(x.team))||{};return `<button class="${i==cd?"on":""}" onclick="cd=${i};draw()"><span class="sub">${short(d.title)}</span><b>${(r.team||"").replace(/^Raquette Rouge Basecles\s*/,"Basècles ")}</b><span class="big">${r.rank?r.rank+"<small>e</small>":"–"}</span> <span class="sub">/ ${d.rows.length} · ${r.points??0} pts</span></button>`}).join("")}</div>`;
const d=dv[cd];
h+=`<h3>${d.title}</h3><table class="cl"><tr><th>#</th><th class="t">Équipe</th><th>J</th><th class="x">G</th><th class="x">P</th><th class="x">N</th><th>FF</th><th>Pts</th></tr>${d.rows.map(r=>`<tr class="${isMe(r.team)?"me":""}"><td>${r.rank}</td><td class="t">${r.team}</td><td>${r.played}</td><td class="x">${r.won}</td><td class="x">${r.lost}</td><td class="x">${r.draw}</td><td>${r.ff}</td><td class="p">${r.points}</td></tr>`).join("")}</table>`;
return h+`<p class="warn">Données officielles AFTT (data.aftt.be), mises à jour automatiquement. Classement après la semaine ${cw}.${upd(c)}</p>`}
const nrm=t=>t.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/…/g,"").toLowerCase().trim();
const tkey=(d,me)=>{const t=d.title,L=(me.match(/\s([A-Z])$/)||[])[1]||"A";if(/Vétérans|Veterans/i.test(t))return "Vétérans "+L;if(/Dames/i.test(t))return "Dames "+L;const n=(t.match(/Division\s*(\d)/)||[])[1];return "P"+n+" "+L};
const ord=k=>{const[v]=dsplit(k),i=DIVO.indexOf(v);return(i<0?99:i)+k};
// Calendrier complet de nos équipes (API AFTT), regroupé par équipe : { "P3 A": [match, …], … }
function teams(){if(!MT||!MT.matches)return{};if(MT.T)return MT.T;const T={};MT.matches.forEach(m=>{const home=m.homeClub==CLUB,opp=home?m.away:m.home;if(!opp||/^Bye\b/i.test(opp))return;const k=tkey({title:m.division},home?m.home:m.away);(T[k]=T[k]||[]).push({...m,isHome:home,opp})});
const S={};Object.keys(T).sort((a,b)=>ord(a).localeCompare(ord(b))).forEach(k=>S[k]=T[k].sort((a,b)=>a.week-b.week));return MT.T=S}
const fdate=(x,o)=>x.date?new Date(x.date+"T12:00:00").toLocaleDateString("fr-BE",o||{weekday:"short",day:"2-digit",month:"2-digit"}):"";
const mres=x=>{const s=x.score||"";if(!s)return"";if(x.homeForfeit||x.awayForfeit||/\bff\b|\bfg\b|forfait/i.test(s))return"F";const n=s.match(/(\d+)\s*-\s*(\d+)/);if(!n)return"";const e=x.isHome?n[1]-n[2]:n[2]-n[1];return e>0?"V":e<0?"D":"N"};
function mDate(k,opp,w){const T=teams()[k];if(T){const o=nrm(opp),c=T.filter(x=>x.date&&!x.score&&(nrm(x.opp).startsWith(o)||o.startsWith(nrm(x.opp)))).sort((a,b)=>Math.abs(a.week-w)-Math.abs(b.week-w))[0];if(c)return fdate(c)+(c.time?" · "+c.time:"")}const[a,b]=D[w-1].split("/").map(Number);return "Semaine du "+new Date(b>=9?2026:2027,b-1,a).toLocaleDateString("fr-BE",{day:"2-digit",month:"2-digit"})}
const isVet=d=>/Vétérans|Veterans/i.test(d.title);
// Les vétérans ont une semaine d'avance : la semaine W des autres équipes correspond à la semaine W+1 des vétérans.
const DIVC={"Vétérans":"#f0b400","P1":"#ff4d4d","P2":"#ff6a3d","P3":"#ff8a1f","P4":"#3d9cff","P5":"#1fd1a0","P6":"#b06cff","Dames":"#ff5fa8"},DIVO=Object.keys(DIVC);
const dsplit=k=>{const i=k.lastIndexOf(" ");return[k.slice(0,i),k.slice(i+1)]};
function resultats(){if(!rw)rw=curWeek();loadMT();const vw=rw<22?[rw+1]:[];if(rw==1)vw.unshift(1);[rw,...vw].forEach(loadCL);const ws=[rw,...vw].map(w=>CL[w]),c=ws.find(x=>x.loading||x.error)||{divisions:[...CL[rw].divisions.filter(d=>!isVet(d)),...vw.flatMap(w=>CL[w].divisions.filter(isVet))]};
let h=`<div class="rh"><h2>RÉSULTATS</h2><div class="wk"><button ${rw<=1?"disabled":""} onclick="rw--;draw()">◀</button><span>${rw}${rw==1?"ère":"ème"} semaine<span class="sub">${D[rw-1]}</span></span><button ${rw>=22?"disabled":""} onclick="rw++;draw()">▶</button></div></div>`;
if(c.loading)return h+`<p class="sub">Chargement des résultats AFTT…</p>`;
if(c.error)return h+`<p class="sub">${c.error} <button onclick="for(const w in CL)if(CL[w].error)delete CL[w];draw()">Réessayer</button></p>`;
const L=[];c.divisions.forEach(d=>d.matches.filter(m=>isMe(m.home)||isMe(m.away)).forEach(m=>{const me=isMe(m.home)?m.home:m.away,opp=isMe(m.home)?m.away:m.home,s=m.score||"",ff=/\bff\b|\bfg\b|forfait/i.test(s),n=s.match(/(\d+)\s*-\s*(\d+)/);
let r="";if(ff)r="F";else if(n){const a=+n[1],b=+n[2],e=isMe(m.home)?a-b:b-a;r=e>0?"V":e<0?"D":"N"}
const k=tkey(d,me),rk=(d.rows.find(x=>isMe(x.team))||{}).rank;L.push({d,m,me,opp,s,n,r,k,rk})}));
if(!L.length)return h+`<p class="sub">Aucun match de nos équipes cette semaine.</p>`;
L.sort((a,b)=>ord(a.k).localeCompare(ord(b.k)));
const up=L.filter(x=>!x.r),pl=L.filter(x=>x.r),nb=k=>pl.filter(x=>x.r==k).length;
const IC={V:"✓",N:"=",D:"✗",F:"–"};
const row=x=>{const[dv,lt]=dsplit(x.k),col=DIVC[dv]||"#999",sh=dv=="Vétérans"?"Vét.":dv;
return `<tr><td class="dv" style="--c:${col}"><span class="l">${dv}</span><span class="s">${sh}</span></td><td><span class="l">Basècles </span>${lt}</td><td class="op">${x.opp}<span class="loc ${isMe(x.m.home)?"h":"a"}">${isMe(x.m.home)?`<span class="l">🏠 Domicile</span><span class="s">🏠 Dom.</span>`:`<span class="l">✈ Extérieur</span><span class="s">✈ Ext.</span>`}</span></td><td class="sc">${x.r?(x.r=="F"?`<small>Forfait</small>`:x.n[1]+" - "+x.n[2]):`<small>${mDate(x.k,x.opp,rw)}</small>`}</td><td class="r ${x.r||"U"}">${x.r?IC[x.r]:"…"}</td><td class="ck">${x.rk?`<span class="${x.rk==1?"first":""}">${x.rk}<sup>${x.rk==1?"er":"e"}</sup></span>`:"–"}</td></tr>`};
const tbl=a=>`<table class="rt"><colgroup><col style="width:17%"><col style="width:16%"><col style="width:28%"><col style="width:15%"><col style="width:11%"><col style="width:13%"></colgroup><tr><th><span class="l">Division</span><span class="s">Div.</span></th><th><span class="l">Équipe</span><span class="s">Éq.</span></th><th><span class="l">Adversaire</span><span class="s">Adv.</span></th><th>Score</th><th>Rés.</th><th><span class="l">Class.</span><span class="s">Cl.</span></th></tr>${a.map(row).join("")}</table>`;
const lg=(col,n,t)=>`<span><i style="background:${col}"></i>${n} ${t}</span>`;
if(pl.length)h+=tbl(pl)+`<div class="lgd">${lg("#22a03c",nb("V"),nb("V")>1?"victoires":"victoire")}${lg("#d98a0b",nb("N"),nb("N")>1?"nuls":"nul")}${lg("#d82020",nb("D"),nb("D")>1?"défaites":"défaite")}${nb("F")?lg("#7a7a7a",nb("F"),nb("F")>1?"forfaits":"forfait"):""}</div>`;
if(up.length)h+=`<div class="rsec">À venir</div>`+tbl(up);
return h+`<p class="warn">Données officielles AFTT (data.aftt.be). Les vétérans ayant une semaine d'avance, leur semaine N+1 est affichée avec la semaine N des autres équipes.${upd(CL[rw])}</p>`}
const ev=e=>e>0?`<span class="up">▲ +${e.toFixed(2)}</span>`:e<0?`<span class="dn">▼ ${e.toFixed(2)}</span>`:`<span class="eq">= 0</span>`;
function draw(){
document.getElementById("nav").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};draw()">${t}</button>`).join("");
let h="";
if(tab==0){loadPL();if(PL.loading)h=`<p class="sub">Chargement du classement des joueurs AFTT…</p>`;
else if(PL.error)h=`<p class="sub">${esc(PL.error)} <button onclick="PL=null;draw()">Réessayer</button></p>`;
else{const L=[...PL.players].sort((a,b)=>sort=="pts"?b.points-a.points:b.evolution-a.evolution);
h=`<div class="tog"><button class="${sort=="pts"?"on":""}" onclick="sort='pts';draw()">Par points</button><button class="${sort=="evo"?"on":""}" onclick="sort='evo';draw()">Par évolution</button></div>`+
L.map((p,i)=>`<div class="row"><span class="rk">${i+1}</span><span class="nm">${esc(p.name)}<br><span class="sub">${p.cat?esc(p.cat)+" · ":""}${p.matches} matchs${p.rank?" · n° "+p.rank:""}</span></span><span class="pt">${p.points.toFixed(2)}</span><span class="ev">${ev(p.evolution)}</span></div>`).join("")+
`<p class="warn">Classement numérique officiel AFTT (data.aftt.be), mis à jour automatiquement. ▲▼ = évolution depuis les points de base du début de saison.${upd(PL)}</p>`}}
if(tab==1)h=resultats();
if(tab==2){loadMT();if(MT.loading)h=`<p class="sub">Chargement des matchs AFTT…</p>`;
else if(MT.error)h=`<p class="sub">${esc(MT.error)} <button onclick="MT=null;draw()">Réessayer</button></p>`;
else{const T=teams(),K=Object.keys(T);if(!T[team])team=K[0];const all=T[team]||[];
const pl=all.filter(x=>mres(x)),up=all.filter(x=>!mres(x)),c=pl.map(mres),n=k=>c.filter(z=>z==k).length;
const nm=x=>{const me=`<b>R.R. Basècles ${esc(dsplit(team)[1])}</b>`,o=esc(x.opp);return x.isHome?me+"<br>"+o:o+"<br>"+me};

name: Debug match
on: workflow_dispatch
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extrait
        run: |
          cat > debug.mjs <<'EOF'
          import fs from "node:fs";
          const post = async (url, o) =>
            (await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams(o),
            })).text();
          const rk = await post("https://data.aftt.be/interclubs/rankings.php", { indice: "H297", semaine: "1" });
          const rows = [...rk.matchAll(/<tr>([\s\S]*?)<\/tr>/g)].map((m) => m[1]).filter((r) => /match_id/.test(r));
          const mine = rows.filter((r) => /Bas[eè]cles/i.test(r));
          const id = ((mine[0] || rows[0] || "").match(/name="match_id" value="(\d+)"/) || [])[1];
          const html = await post("https://data.aftt.be/interclubs/match.php", { match_id: id });
          const clean = html
            .replace(/<head[\s\S]*?<\/head>/g, "")
            .replace(/<script[\s\S]*?<\/script>/g, "")
            .replace(/<style[\s\S]*?<\/style>/g, "")
            .replace(/>\s+</g, ">\n<");
          fs.mkdirSync("data", { recursive: true });
          fs.writeFileSync("data/debug-match2.txt", "match_id=" + id + "\nlignes_club=" + mine.length + "\n" + clean.slice(0, 30000));
          EOF
          node debug.mjs
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/debug-match2.txt
          git commit -m "debug 2"
          git push

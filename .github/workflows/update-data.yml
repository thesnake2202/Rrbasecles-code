name: Mise à jour des données

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      import_from:
        description: "Adresse de l'ancien site Netlify (import unique de l'historique), ex. https://monsite.netlify.app"
        required: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Récupérer les données AFTT
        run: node scripts/build-data.mjs
        env:
          IMPORT_FROM: ${{ inputs.import_from }}

      - name: Enregistrer les changements
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html
          if ! git diff --staged --quiet; then
            git commit -m "Mise à jour automatique des données"
            git pull --rebase
            git push
          fi
